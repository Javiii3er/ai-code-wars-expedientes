<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedientes – Bufete Popular</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/consulta.css">
  <link rel="stylesheet" href="css/seguimiento.css">
</head>
<body>
  <header class="app-header">
    <h1>Expedientes – Bufete Popular</h1>
    <p class="aviso">Prototipo con datos ficticios. No brinda asesoría jurídica.</p>
  </header>

  <main id="app">
    <div id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></div>

    <section class="tarjeta" aria-labelledby="titulo-apertura">
      <h2 id="titulo-apertura">Abrir expediente</h2>
      <p class="ayuda">Los campos marcados con * son obligatorios. Use nombres ficticios o alias.</p>

      <form id="form-apertura" novalidate>
        <div class="campo">
          <label for="persona">Persona solicitante (nombre ficticio o alias) *</label>
          <input type="text" id="persona" name="persona" maxlength="100" autocomplete="off">
          <p class="error-campo" id="error-persona"></p>
        </div>

        <div class="campo">
          <label for="asunto">Descripción breve del asunto *</label>
          <textarea id="asunto" name="asunto" rows="3" maxlength="500"></textarea>
          <p class="error-campo" id="error-asunto"></p>
        </div>

        <div class="campo">
          <label for="responsable">Responsable *</label>
          <input type="text" id="responsable" name="responsable" maxlength="100" autocomplete="off">
          <p class="error-campo" id="error-responsable"></p>
        </div>

        <div class="campo">
          <label for="categoria">Categoría (opcional)</label>
          <select id="categoria" name="categoria">
            <option value="">Sin categoría</option>
            <option value="Civil">Civil</option>
            <option value="Familiar">Familiar</option>
            <option value="Laboral">Laboral</option>
          </select>
        </div>

        <button type="submit" class="boton boton-primario">Abrir expediente</button>
      </form>
    </section>

    <!-- Compañera 1 (js/consulta.js): listado y búsqueda -->
    <section class="tarjeta" id="seccion-listado" aria-labelledby="titulo-listado">
      <h2 id="titulo-listado">Expedientes</h2>
    </section>

    <!-- Compañera 1 (js/consulta.js): detalle e historial.
         Dentro, Compañera 2 (js/seguimiento.js) dibuja en #acciones-expediente. -->
    <section class="tarjeta" id="seccion-detalle" aria-labelledby="titulo-detalle" hidden>
      <h2 id="titulo-detalle">Detalle del expediente</h2>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/consulta.js"></script>
  <script src="js/seguimiento.js"></script>
  <script src="js/reapertura.js"></script>
</body>
</html>
